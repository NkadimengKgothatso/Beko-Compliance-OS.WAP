<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/bg.jpeg">
<title>Template Library — Beko ComplianceOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="stylesheet" href="/assets/mobile-nav.css">
<script src="/assets/mobile-nav.js" defer></script>
<link rel="stylesheet" href="templates.css">
</head>
<body>

<aside>
    <img src="/beko-logo.png" alt="Beko ComplianceOS">
    <nav>
        <a href="/dashboard/dashboard.html">Dashboard</a>
        <a href="/templates/templates.html" class="active">Templates</a>
        <a href="/education/education.html">Education Hub</a>
        <a href="/tenders/tenders.html">Tenders</a>
        <a href="/aml/aml.html">AML Screener</a>
        <a href="/notifications/notifications.html">Notifications</a>
        <a href="/consultation/consultation.html">Consultation</a>
        <a href="/compliance/compliance.html">Compliance</a>
        <a href="/documents/documents.html">Documents</a>
        <a href="/profile/profile.html">Profile</a>
    </nav>
    <div class="user-box">
        <div class="name" id="userName">User</div>
        <div class="email" id="userEmail">—</div>
        <button class="logout" id="logoutBtn">Logout</button>
    </div>
</aside>

<main>
    <div class="header">
        <h1>Template library</h1>
        <p>Download professional legal and compliance documents for your business.</p>
    </div>

    <div class="toolbar">
        <div class="tabs" id="tabs">
            <button class="tab active" data-cat="all">All</button>
            <button class="tab" data-cat="contracts">Contracts</button>
            <button class="tab" data-cat="hr">HR</button>
            <button class="tab" data-cat="legal">Legal</button>
            <button class="tab" data-cat="corporate">Corporate</button>
            <button class="tab" data-cat="policies">Policies</button>
            <button class="tab" data-cat="tax">Tax</button>
        </div>
        <input type="text" class="search" id="search" placeholder="Search templates...">
    </div>

    <div class="grid" id="grid"></div>
</main>

<script type="module" src="templates.js"></script>
</body>
</html>
