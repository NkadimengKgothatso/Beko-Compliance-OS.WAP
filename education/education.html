<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/bg.jpeg">
<title>Legal Education Hub — Beko ComplianceOS</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/assets/mobile-nav.css">
<script src="/assets/mobile-nav.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--navy:#1B2A5C;--green:#4CAF50;--teal:#2CB5B8;--bg:#F4F6FA;--text:#374151;--muted:#6B7280;--border:#E5E7EB;--danger:#DC2626;--warn:#D97706}
*{margin:0;padding:0;box-sizing:border-box}
body{display:grid;grid-template-columns:240px 1fr;min-height:100vh;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg)}
aside{background:#fff;border-right:1px solid var(--border);padding:32px 24px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside img{width:160px;margin-bottom:32px;filter:brightness(1.15);background:rgba(27,42,92,.04);padding:12px 16px;border-radius:12px}
aside nav{flex:1}
aside nav a{display:block;padding:10px 14px;border-radius:8px;text-decoration:none;color:var(--text);font-size:.88rem;font-weight:500;margin-bottom:4px;transition:background .2s}
aside nav a:hover{background:#F3F4F6}
aside nav a.active{background:#EFF8F0;color:var(--navy);font-weight:600;box-shadow:inset 3px 0 0 var(--green)}
.user-box{border-top:1px solid var(--border);padding-top:16px}
.user-box .name{font-weight:600;font-size:.85rem;color:var(--navy)}
.user-box .email{font-size:.75rem;color:var(--muted);margin-bottom:12px;overflow:hidden;text-overflow:ellipsis}
.logout{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;background:#fff;color:var(--text);font:inherit;font-size:.82rem;cursor:pointer;transition:background .2s}
.logout:hover{background:#FEE2E2;color:var(--danger);border-color:#FECACA}
main{padding:40px 48px}
.header{margin-bottom:28px}
.header h1{color:var(--navy);font-size:1.6rem;margin-bottom:4px}
.header p{color:var(--muted);font-size:.88rem}
.search{padding:11px 14px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:.9rem;width:100%;max-width:360px;margin-bottom:24px}
.search:focus{outline:none;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:12px;padding:22px;border:1px solid var(--border);transition:box-shadow .2s,border-color .2s;cursor:pointer}
.card:hover{border-color:var(--teal);box-shadow:0 4px 20px rgba(27,42,92,.06)}
.tag{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--teal);background:#E0F2F1;padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:10px}
.card h3{font-size:1rem;color:var(--navy);margin-bottom:8px}
.card p{font-size:.85rem;color:var(--text);line-height:1.5;margin-bottom:12px}
.card small{font-size:.78rem;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:rgba(27,42,92,.5);z-index:1000;place-items:center;padding:24px}
.modal.active{display:grid}
.modal-content{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:80vh;overflow-y:auto;padding:32px;position:relative}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;border:none;background:#F3F4F6;color:var(--text);font-size:1.2rem;cursor:pointer}
.modal-content h2{color:var(--navy);margin-bottom:12px}
.modal-content p{margin-bottom:14px;line-height:1.6;color:var(--text)}
.modal-content ul{margin-left:20px;margin-bottom:14px;color:var(--text)}
.modal-content li{margin-bottom:6px}
.slide-action{display:flex;justify-content:flex-end;margin-bottom:16px}
.btn-slide{padding:10px 16px;border:none;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-slide:hover{background:#2E4A8E}
@media(max-width:1024px){body{grid-template-columns:1fr}aside{display:none}main{padding:24px 16px}}
</style>
</head>
<body>

<aside>
    <img src="/bg.jpeg" alt="Beko ComplianceOS">
    <nav>
        <a href="/dashboard/dashboard.html">Dashboard</a>
        <a href="/templates/templates.html">Templates</a>
        <a href="/education/education.html" class="active">Education Hub</a>
        <a href="/tenders/tenders.html">Tenders</a>
        <a href="/aml/aml.html">AML Screener</a>
        <a href="/notifications/notifications.html">Notifications</a>
        <a href="/consultation/consultation.html">Consultation</a>
        <a href="/compliance/compliance.html">Compliance</a>
        <a href="/profile/profile.html">Profile</a>
        <a href="/admin/admin.html">Admin</a>
    </nav>
    <div class="user-box">
        <div class="name" id="userName">User</div>
        <div class="email" id="userEmail">—</div>
        <button class="logout" id="logoutBtn">Logout</button>
    </div>
</aside>

<main>
    <div class="header">
        <h1>Legal Education Hub</h1>
        <p>Plain-language guides to South African business compliance.</p>
    </div>
    <input type="text" class="search" id="search" placeholder="Search topics...">
    <div class="grid" id="grid"></div>
</main>

<div class="modal" id="modal">
    <div class="modal-content">
        <button class="modal-close" id="closeModal">&times;</button>
        <div id="modalBody"></div>
    </div>
</div>

<script type="module">
import { supabase } from "/supabase.js";

const articles = [
    {

                <li>Reserve a company name or use a registration number directly.</li>
                <li>Complete the CoR14.1 application with director and shareholder details.</li>

    },

            <ul>
                <li>Register as an employer on uFiling.</li>

            <h2>SARS eFiling for business</h2>

        body: `
            <h2>How to handle a SARS audit</h2>

                <li>Reconcile your accounting records to your tax returns.</li>

    },
    {
        id: "ohs", tag: "OHS", title: "Workplace health and safety essentials", read: "4 min",
        summary: "Basic duties under the Occupational Health and Safety Act for small employers.",
        body: `
            <h2>Workplace health and safety essentials</h2>
            <p>Employers must provide a workplace that is safe and without risk to health, as far as reasonably practicable.</p>
            <ul>
                <li>Identify hazards and assess risks regularly.</li>
                <li>Provide information, instructions, and training.</li>
                <li>Maintain equipment and safety equipment.</li>
                <li>Keep an incident register and report serious incidents.</li>
                <li>Display evacuation plans and first-aid facilities.</li>
            </ul>
            <p>Templates include a health and safety policy you can adapt.</p>
        `

];

function render(searchTerm = "") {
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    const filtered = articles.filter(a => a.title.toLowerCase().includes(searchTerm.toLowerCase()) || a.summary.toLowerCase().includes(searchTerm.toLowerCase()) || a.tag.toLowerCase().includes(searchTerm.toLowerCase()));
    filtered.forEach(a => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `<span class="tag">${a.tag}</span><h3>${a.title}</h3><p>${a.summary}</p><small>\u23f5 ${a.read} read</small>`;
        card.onclick = () => openModal(a);
        grid.appendChild(card);
    });
}

function openModal(a) {
    window.currentArticle = a;
    document.getElementById("modalBody").innerHTML = `
        <div class="slide-action">
            <button class="btn-slide" onclick="downloadSlides()"><i class="fas fa-file-pdf"></i> Download slides (PDF)</button>
        </div>
        ${a.body}
    `;
    document.getElementById("modal").classList.add("active");
}

let logoDataUrl = null;
function loadLogo() {
    if (logoDataUrl) return Promise.resolve(logoDataUrl);
    return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
            try {
                const canvas = document.createElement("canvas");
                canvas.width = img.naturalWidth;
                canvas.height = img.naturalHeight;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0);
                logoDataUrl = canvas.toDataURL("image/jpeg", 0.9);
            } catch (e) { logoDataUrl = null; }
            resolve(logoDataUrl);
        };
        img.onerror = () => resolve(null);
        img.src = "/bg.jpeg";
    });
}

function parseArticleSlides(html) {
    const div = document.createElement("div");
    div.innerHTML = html;
    const slides = [];
    let current = { title: "", bullets: [] };
    Array.from(div.children).forEach(node => {
        const tag = node.tagName;
        if (tag === "H2") {
            if (current.title || current.bullets.length) slides.push(current);
            current = { title: node.textContent.trim(), bullets: [] };
        } else if (tag === "P") {
            const txt = node.textContent.trim();
            if (txt) current.bullets.push(txt);
        } else if (tag === "UL" || tag === "OL") {
            Array.from(node.querySelectorAll("li")).forEach(li => {
                const t = li.textContent.trim();
                if (t) current.bullets.push(t);
            });
        }
    });
    if (current.title || current.bullets.length) slides.push(current);
    return slides;
}

async function downloadSlides() {
    const a = window.currentArticle;
    if (!a) return;
    await loadLogo();
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF("landscape", "mm", "a4");
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const margin = 20;
    const navy = [27, 42, 92];
    const teal = [44, 181, 184];

    function drawHeader() {
        if (logoDataUrl) {
            try { doc.addImage(logoDataUrl, "JPEG", margin, 10, 20, 10); } catch (e) {}
        }
        doc.setFontSize(8);
        doc.setTextColor(...navy);
        doc.setFont("helvetica", "bold");
        doc.text("BEKO COMPLIANCEOS", pageW - margin, 14, { align: "right" });
        doc.setFontSize(7);
        doc.setTextColor(120, 120, 120);
        doc.setFont("helvetica", "normal");
        doc.text("South African SME compliance tools", pageW - margin, 18, { align: "right" });
        doc.setDrawColor(...teal);
        doc.setLineWidth(0.5);
        doc.line(margin, 22, pageW - margin, 22);
    }
    function drawFooter(pg, total) {
        const y = pageH - 10;
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.2);
        doc.line(margin, y - 3, pageW - margin, y - 3);
        doc.setFontSize(7);
        doc.setTextColor(120, 120, 120);
        doc.text("For educational guidance only. Seek professional advice.", margin, y);
        doc.text(`${pg} / ${total}`, pageW - margin, y, { align: "right" });
    }
    function addPage() { doc.addPage(); drawHeader(); }

    drawHeader();
    let y = 35;
    doc.setFontSize(22);
    doc.setTextColor(...navy);
    doc.setFont("helvetica", "bold");
    doc.text(a.title, margin, y);
    y += 10;
    doc.setFontSize(11);
    doc.setTextColor(...teal);
    doc.setFont("helvetica", "italic");
    doc.text(`${a.tag} · ${a.read} read`, margin, y);
    y += 16;
    doc.setFontSize(10);
    doc.setTextColor(60, 60, 60);
    doc.setFont("helvetica", "normal");
    const summaryLines = doc.splitTextToSize(a.summary, pageW - margin * 2);
    doc.text(summaryLines, margin, y);
    y += summaryLines.length * 5 + 10;
    doc.setFontSize(9);
    doc.setTextColor(120, 120, 120);
    doc.text("Generated by Beko ComplianceOS", margin, y);

    const slides = parseArticleSlides(a.body);
    slides.forEach((slide) => {
        addPage();
        y = 35;
        doc.setFontSize(16);
        doc.setTextColor(...teal);
        doc.setFont("helvetica", "bold");
        doc.text(slide.title || "Key points", margin, y);
        y += 12;
        doc.setFontSize(11);
        doc.setTextColor(30, 30, 30);
        doc.setFont("helvetica", "normal");
        slide.bullets.forEach(bullet => {
            if (y > pageH - 30) { addPage(); y = 35; }
            const wrapped = doc.splitTextToSize(bullet, pageW - margin * 2 - 8);
            doc.text("•", margin, y);
            doc.text(wrapped, margin + 6, y);
            y += wrapped.length * 5 + 5;
        });
    });

    const total = doc.internal.getNumberOfPages();
    for (let i = 1; i <= total; i++) {
        doc.setPage(i);
        drawFooter(i, total);
    }
    doc.save(`${a.id}-slides.pdf`);
}

document.getElementById("search").oninput = e => render(e.target.value);
document.getElementById("closeModal").onclick = () => document.getElementById("modal").classList.remove("active");
document.getElementById("modal").onclick = e => { if (e.target.id === "modal") document.getElementById("modal").classList.remove("active"); };

const { data: { user } } = await supabase.auth.getUser();
if (!user) window.location.href = "/login/login.html";
document.getElementById("userEmail").textContent = user?.email || "—";
document.getElementById("userName").textContent = user?.user_metadata?.full_name || "User";

document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = "/login/login.html";
};

render();
</script>
</body>
</html>
