<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Register</title>
    <link rel="stylesheet" href="login.css">
    
</head>
<body>

<div class="container" id="container">

    <!-- SIGN UP FORM -->
    <div class="form-container sign-up-container">
        <form>
            <h1>Create Account</h1>
            <input type="text" placeholder="Name" aria-label="Name" required />
            <input type="email" placeholder="Email" aria-label="Email" required />
            <input type="password" placeholder="Password" aria-label="Password" required />
            <button type="submit">Sign Up</button>
        </form>
    </div>

    <!-- SIGN IN FORM -->
    <div class="form-container sign-in-container">
        <form>
            <h1>Sign In</h1>
            <input type="email" placeholder="Email" aria-label="Email" required />
            <input type="password" placeholder="Password" aria-label="Password" required />
            <button type="submit">Sign In</button>
        </form>
    </div>

    <!-- OVERLAY -->
    <div class="overlay-container">
        <div class="overlay">
            
            <!-- LEFT PANEL (Login Switch) -->
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>Enter your details to login</p>
                <button class="ghost" id="loginSwitch">Sign In</button>
            </div>

            <!-- RIGHT PANEL (Register Switch) -->
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Register with your details</p>
                <button class="ghost" id="registerSwitch">Sign Up</button>
            </div>

        </div>
    </div>

</div>



<script src="login.js"></script>
</body>
</html>
