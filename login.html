<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login & Register</title>
    <link rel="stylesheet" href="login.css">
    
</head>
<body>

    <div class="container" id="container">

        <!-- SIGN UP FORM -->
    <div class="form-container sign-up-container">
        <form>
            <h1>Create Account</h1>

        
            <div class="social-login">
                <button type="button" class="google-btn">
                    Sign up with Google
                </button>

                <button type="button" class="facebook-btn">
                    Sign up with Facebook
                </button>

                <button type="button" class="github-btn">
                    Sign up with GitHub
                </button>
            </div>
        </form>
    </div>

    <!-- SIGN IN FORM -->
  <div class="form-container sign-in-container">
    <form>
        <h1>Sign In</h1>

        <input type="email" placeholder="Email" aria-label="Email" required />
        <input type="password" placeholder="Password" aria-label="Password" required />

        <!-- ROLE SELECT -->
        <select required>
            <option value="" disabled selected>Select Role</option>
            <option value="client">Client</option>
            <option value="admin">Admin</option>
        </select>

        <button type="submit">Sign In</button>
    </form>
</div>

    <!-- OVERLAY -->
    <div class="overlay-container">
        <div class="overlay">
            
            <!-- LEFT PANEL (Login Switch) -->
            <div class="overlay-panel overlay-left">
                <h1>Welcome Back!</h1>
                <p>Enter your details to login</p>
                <button class="ghost" id="loginSwitch">Sign In</button>
            </div>

            <!-- RIGHT PANEL (Register Switch) -->
            <div class="overlay-panel overlay-right">
                <h1>Hello, Friend!</h1>
                <p>Register with your details</p>
                <button class="ghost" id="registerSwitch">Sign Up</button>
            </div>

        </div>
    </div>

</div>



<script src="login.js"></script>
</body>
</html>
