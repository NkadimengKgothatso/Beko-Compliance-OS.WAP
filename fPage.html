<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome</title>
<style>
    /* Reset */
    * {
        margin: 0;
        padding: 0;
        
    }

    body, html {
        height: 100%;
        font-family: Arial, sans-serif;
       
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        overflow: hidden;
    }

    /* Logo styling */
    .logo-container {
        opacity: 0;
        animation: logoFade 2s ease-in forwards, logoFadeOut 1s ease-in forwards;
        animation-delay: 0s, 3s; /* fade in immediately, fade out after 3s */
    }

    .logo-container img {
        max-width: 300px;
        width: 80%;
        height: auto;
        border-radius: 20px;
    }

    /* Text styling */
    .text-container {
        opacity: 0;
        transform: translateY(20px);
        animation: showText 1.5s ease-out forwards;
        animation-delay: 4s; /* appear after logo fades out */
    }

    .text-container h1 {
        font-size: 2rem;
        font-weight: 700;
        height: 100;
        size: 50%;
        text-align: center;
        background: linear-gradient(90deg, #0b0d1a, #898686, #1a8cac, #1dcde1);
        background-size: 300% 300%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradientShift 5s ease infinite;
    }

    /* Keyframes for logo fade in */
    @keyframes logoFade {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }

    /* Keyframes for logo fade out */
    @keyframes logoFadeOut {
        0% { opacity: 1; }
        100% { opacity: 0; }
    }

    /* Keyframes for text fade in */
    @keyframes showText {
        0% { opacity: 0; transform: translateY(20px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    /* Gradient shift */
    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
</style>
</head>
<body>

<div class="logo-container">
    <img src="bg.jpeg" alt="App Logo">
</div>

<div class="text-container">
    <h1>Welcome <br> to <br> Beko <br> OS</h1>
</div>

<script>
    // Redirect to login page after 7 seconds
    setTimeout(() => {
        window.location.href = "login.html";
    }, 7000);
</script>

</body>
</html>
