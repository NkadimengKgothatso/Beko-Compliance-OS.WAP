<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beko ComplianceOS — Email Action</title>
    <link rel="stylesheet" href="action-handler.css">
</head>
<body>
<main class="action-shell">
    <section class="action-card">

        <!-- Logo -->
        <div class="brand">
            <img src="../bg.jpeg" alt="Beko ComplianceOS">
        </div>

        <!-- Dynamic content panel -->
        <div id="actionPanel" class="panel loading">
            <h2 id="actionTitle">Processing...</h2>
            <p id="actionMessage">Please wait while we process your request.</p>

            <!-- Password reset form (hidden by default, shown when mode=resetPassword) -->
            <form id="resetForm" style="display: none;">
                <p class="reset-email">Resetting password for: <strong id="resetEmail"></strong></p>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Minimum 6 characters" required>
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit">Reset Password</button>
            </form>
        </div>

    </section>
</main>

<script type="module" src="action-handler.js"></script>
</body>
</html>
