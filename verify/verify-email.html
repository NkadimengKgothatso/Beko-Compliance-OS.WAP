<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/bg.jpeg">
<title>Verify Email — Beko ComplianceOS</title>
<link rel="stylesheet" href="verify-email.css">
</head>
<body>
<div class="card">
    <img src="/beko-logo.png" alt="Beko ComplianceOS">
    <p class="eyebrow" id="eyebrow">Email verification</p>
    <h2 id="title">Enter your verification code</h2>
    <p id="message">We sent an 8-digit code to <strong id="userEmail">your email</strong>. Enter it below to verify your account.</p>

    <div class="code-inputs" id="codeInputs">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" data-idx="0">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="6">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="7">
    </div>

    <div class="status" id="statusBox">
        <span class="status-icon" id="statusIcon">&#10003;</span>
        <span class="dot" id="dot"></span>
        <span id="statusText">Waiting for code</span>
    </div>

    <div class="actions" id="actions">
        <button class="btn btn-primary" id="verifyBtn">Verify code</button>
        <a class="btn btn-secondary" id="openEmailBtn" href="#" target="_blank" rel="noopener">Open email app</a>
        <button class="btn btn-secondary" id="resendBtn" disabled>Resend code</button>
        <div class="cooldown-bar"><div class="cooldown-fill" id="cooldownFill"></div></div>
        <p class="cooldown-text" id="cooldownText"></p>
        <button class="btn btn-secondary" id="logoutBtn">Use a different account</button>
    </div>

    <div class="help">
        <p>Didn't receive it? Check your spam or junk folder.</p>
        <p><a href="#" id="linkFallback">Verify with email link instead &rarr;</a></p>
    </div>
</div>

<script type="module" src="verify-email.js"></script>

</body>
</html>
