<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — Beko ComplianceOS</title>
<style>
:root{--navy:#1B2A5C;--green:#4CAF50;--teal:#2CB5B8;--bg:#F4F6FA;--text:#374151;--muted:#6B7280;--border:#E5E7EB}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
.card{background:#fff;border-radius:16px;padding:48px;max-width:480px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(27,42,92,.06);border:1px solid var(--border)}
.card img{width:180px;margin:0 auto 24px;display:block}
.eyebrow{color:var(--teal);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.card h2{color:var(--navy);font-size:1.5rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:24px}
.status{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px;font-size:.85rem;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;background:#FCD34D;animation:pulse 1.5s infinite}
.dot.ok{background:var(--green);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.actions{display:flex;flex-direction:column;gap:12px}
.btn{padding:13px;border:none;border-radius:8px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .2s}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#2E4A8E}
.btn-secondary{background:#F3F4F6;color:var(--text)}.btn-secondary:hover{background:#E5E7EB}
.btn:disabled{opacity:.5;cursor:not-allowed}
.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:8px;font-size:.9rem;z-index:9999;transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}
.toast-error{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.toast-success{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}
</style>
</head>
<body>
<div class="card">
    <img src="/bg.jpeg" alt="Beko ComplianceOS">
    <p class="eyebrow">Email verification</p>
    <h2>Check your inbox</h2>
    <p>We sent a verification link to <strong id="userEmail">your email</strong>. Click the link to activate your account.</p>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">Waiting for verification</span></div>
    <div class="actions">
        <button class="btn btn-primary" id="checkBtn">I've verified my email</button>
        <button class="btn btn-secondary" id="resendBtn">Resend verification email</button>
        <button class="btn btn-secondary" id="logoutBtn">Use a different account</button>
    </div>
</div>
<script type="module">
import { supabase } from "/supabase.js";
import { routeUser } from "/shared/router.js";
import { toast, loading } from "/shared/ui.js";

const dot = document.getElementById("dot");
const statusText = document.getElementById("statusText");

const { data: { user } } = await supabase.auth.getUser();
if (!user) { window.location.href = "/login/login.html"; }
else {
    document.getElementById("userEmail").textContent = user.email;
    if (user.email_confirmed_at) {
        dot.classList.add("ok");
        statusText.textContent = "Email verified! Redirecting...";
        await routeUser("/verify/verify-email.html");
    }
}

document.getElementById("checkBtn").onclick = async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return window.location.href = "/login/login.html";
    const btn = document.getElementById("checkBtn");
    loading(btn, true);
    // Refresh user data
    const { data: { user: fresh } } = await supabase.auth.getUser();
    if (fresh?.email_confirmed_at) {
        dot.classList.add("ok");
        statusText.textContent = "Email verified! Redirecting...";
        await routeUser("/verify/verify-email.html");
    } else {
        statusText.textContent = "Not verified yet. Check your inbox.";
    }
    loading(btn, false);
};

document.getElementById("resendBtn").onclick = async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;
    const btn = document.getElementById("resendBtn");
    loading(btn, true);
    const { error } = await supabase.auth.resend({ type: "signup", email: user.email });
    if (error) toast(error.message);
    else toast("Verification email sent!", "success");
    loading(btn, false);
};

document.getElementById("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = "/login/login.html";
};
</script>
</body>
</html>
