<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/bg.jpeg">
<title>Verify Email — Beko ComplianceOS</title>
<style>
:root{--navy:#1B2A5C;--green:#4CAF50;--teal:#2CB5B8;--bg:#F4F6FA;--text:#374151;--muted:#6B7280;--border:#E5E7EB;--danger:#DC2626}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:'Segoe UI',system-ui,sans-serif;padding:20px}
.card{background:#fff;border-radius:16px;padding:48px;max-width:520px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(27,42,92,.06);border:1px solid var(--border)}
.card img{width:180px;margin:0 auto 24px;display:block}
.eyebrow{color:var(--teal);font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.card h2{color:var(--navy);font-size:1.5rem;margin-bottom:8px}
.card p{color:var(--muted);font-size:.9rem;line-height:1.6;margin-bottom:24px}
.status{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px;font-size:.9rem;font-weight:500;min-height:28px}
.status-icon{width:24px;height:24px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--teal);animation:spin 1s linear infinite;display:none}
.status-icon.ok{display:grid;place-items:center;background:var(--green);border-color:var(--green);animation:none;color:#fff;font-size:14px}
.status-icon.err{display:grid;place-items:center;background:var(--danger);border-color:var(--danger);animation:none;color:#fff;font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#FCD34D;animation:pulse 1.5s infinite}
.dot.ok{background:var(--green);animation:none}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin{to{transform:rotate(360deg)}}

.code-inputs{display:flex;gap:8px;justify-content:center;margin-bottom:24px}
.code-input{width:42px;height:52px;text-align:center;font-size:1.4rem;font-weight:700;color:var(--navy);border:2px solid var(--border);border-radius:10px;background:#FAFBFC;outline:none;transition:border .2s,box-shadow .2s}
.code-input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(44,181,184,.12);background:#fff}
.code-input.filled{border-color:var(--navy);background:#fff}

.actions{display:flex;flex-direction:column;gap:12px}
.btn{padding:13px;border:none;border-radius:8px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;transition:background .2s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#2E4A8E}
.btn-secondary{background:#F3F4F6;color:var(--text)}.btn-secondary:hover{background:#E5E7EB}
.btn:disabled{opacity:.5;cursor:not-allowed}

.cooldown-bar{height:4px;background:var(--border);border-radius:4px;margin-top:12px;overflow:hidden}
.cooldown-fill{height:100%;background:var(--teal);border-radius:4px;transition:width 1s linear;width:100%}
.cooldown-text{font-size:.78rem;color:var(--muted);margin-top:6px}

.help{border-top:1px solid var(--border);margin-top:24px;padding-top:20px}
.help p{font-size:.82rem;color:var(--muted);margin-bottom:8px}
.help a{color:var(--teal);text-decoration:none;font-weight:500}

.toast{position:fixed;top:20px;right:20px;padding:14px 20px;border-radius:8px;font-size:.9rem;z-index:9999;transform:translateX(120%);transition:transform .3s}
.toast.show{transform:translateX(0)}
.toast-error{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA}
.toast-success{background:#ECFDF5;color:#065F46;border:1px solid #A7F3D0}

.hide{display:none!important}
@media(max-width:480px){.card{padding:32px 24px}.card img{width:150px}.code-inputs{gap:5px}.code-input{width:36px;height:44px;font-size:1.2rem}}
</style>
</head>
<body>
<div class="card">
    <img src="/bg.jpeg" alt="Beko ComplianceOS">
    <p class="eyebrow" id="eyebrow">Email verification</p>
    <h2 id="title">Enter your verification code</h2>
    <p id="message">We sent an 8-digit code to <strong id="userEmail">your email</strong>. Enter it below to verify your account.</p>

    <div class="code-inputs" id="codeInputs">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code" data-idx="0">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="1">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="2">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="3">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="4">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="5">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="6">
        <input type="text" class="code-input" maxlength="1" inputmode="numeric" pattern="[0-9]" data-idx="7">
    </div>

    <div class="status" id="statusBox">
        <span class="status-icon" id="statusIcon">&#10003;</span>
        <span class="dot" id="dot"></span>
        <span id="statusText">Waiting for code</span>
    </div>

    <div class="actions" id="actions">
        <button class="btn btn-primary" id="verifyBtn">Verify code</button>
        <a class="btn btn-secondary" id="openEmailBtn" href="#" target="_blank" rel="noopener">Open email app</a>
        <button class="btn btn-secondary" id="resendBtn" disabled>Resend code</button>
        <div class="cooldown-bar"><div class="cooldown-fill" id="cooldownFill"></div></div>
        <p class="cooldown-text" id="cooldownText"></p>
        <button class="btn btn-secondary" id="logoutBtn">Use a different account</button>
    </div>

    <div class="help">
        <p>Didn't receive it? Check your spam or junk folder.</p>
        <p><a href="#" id="linkFallback">Verify with email link instead &rarr;</a></p>
    </div>
</div>

<script type="module">
import { supabase } from "/supabase.js";
import { routeUser } from "/shared/router.js";
import { toast, loading } from "/shared/ui.js";

const $ = id => document.getElementById(id);
const title = $("title");
const message = $("message");
const statusText = $("statusText");
const dot = $("dot");
const statusIcon = $("statusIcon");
const codeInputs = document.querySelectorAll(".code-input");
const COOLDOWN_SECONDS = 60;
let cooldownTimer = null;

function setStatus(state, text) {
    if (state === "loading") {
        statusIcon.style.display = "grid";
        statusIcon.className = "status-icon";
        dot.style.display = "none";
    } else if (state === "success") {
        statusIcon.style.display = "grid";
        statusIcon.className = "status-icon ok";
        dot.style.display = "none";
    } else if (state === "error") {
        statusIcon.style.display = "grid";
        statusIcon.className = "status-icon err";
        dot.style.display = "none";
    } else {
        statusIcon.style.display = "none";
        dot.style.display = "inline-block";
    }
    statusText.textContent = text;
}

function setVerified() {
    title.textContent = "Email verified!";
    message.innerHTML = "Your email has been confirmed. Redirecting you to the app&hellip;";
    setStatus("success", "Verified successfully");
    $("verifyBtn").textContent = "Continue to app";
    $("verifyBtn").onclick = () => routeUser("/verify/verify-email.html");
    codeInputs.forEach(i => i.disabled = true);
    $("resendBtn").classList.add("hide");
    $("cooldownFill").parentElement.classList.add("hide");
    $("cooldownText").classList.add("hide");
    clearInterval(cooldownTimer);
}

function detectEmailProvider(email) {
    const domain = email?.split("@")[1]?.toLowerCase();
    const providers = {
        "gmail.com": "https://mail.google.com",
        "outlook.com": "https://outlook.live.com",
        "hotmail.com": "https://outlook.live.com",
        "live.com": "https://outlook.live.com",
        "yahoo.com": "https://mail.yahoo.com",
        "icloud.com": "https://www.icloud.com/mail",
        "me.com": "https://www.icloud.com/mail"
    };
    return providers[domain] || "mailto:" + (email || "");
}

// ─── Resend cooldown timer ──────────────────────────────────────────
function startCooldown() {
    $("resendBtn").disabled = true;
    let remaining = COOLDOWN_SECONDS;
    const fill = $("cooldownFill");
    const text = $("cooldownText");

    fill.style.width = "100%";
    text.textContent = `Resend available in ${remaining}s`;

    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
        remaining--;
        const pct = (remaining / COOLDOWN_SECONDS) * 100;
        fill.style.width = pct + "%";

        if (remaining <= 0) {
            clearInterval(cooldownTimer);
            $("resendBtn").disabled = false;
            text.textContent = "";
            fill.style.width = "0%";
        } else {
            text.textContent = `Resend available in ${remaining}s`;
        }
    }, 1000);
}

// ─── Code input behaviour: auto-advance, paste support, backspace ───
codeInputs.forEach((input, idx) => {
    input.addEventListener("input", e => {
        const v = e.target.value.replace(/[^0-9]/g, "");
        e.target.value = v;
        if (v) {
            e.target.classList.add("filled");
            if (idx < 7) codeInputs[idx + 1].focus();
        } else {
            e.target.classList.remove("filled");
        }
    });
    input.addEventListener("keydown", e => {
        if (e.key === "Backspace" && !e.target.value && idx > 0) {
            codeInputs[idx - 1].focus();
            codeInputs[idx - 1].value = "";
            codeInputs[idx - 1].classList.remove("filled");
        }
    });
    input.addEventListener("paste", e => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text").replace(/[^0-9]/g, "").slice(0, 8);
        for (let i = 0; i < text.length; i++) {
            codeInputs[i].value = text[i];
            codeInputs[i].classList.add("filled");
        }
        if (text.length === 8) codeInputs[7].focus();
        else if (text.length > 0) codeInputs[text.length].focus();
    });
});

function getCode() {
    return Array.from(codeInputs).map(i => i.value).join("");
}

function clearCode() {
    codeInputs.forEach(i => { i.value = ""; i.classList.remove("filled"); });
    codeInputs[0].focus();
}

// Auto-submit when 8 digits entered
codeInputs[7].addEventListener("input", () => {
    if (getCode().length === 8) verifyCode();
});

// ─── Verify the OTP ─────────────────────────────────────────────────
async function verifyCode() {
    const code = getCode();
    if (code.length !== 8) return toast("Enter all 8 digits");

    const { data: { user } } = await supabase.auth.getUser();
    const email = user?.email || $("userEmail").textContent;

    const btn = $("verifyBtn");
    loading(btn, true);
    setStatus("loading", "Verifying\u2026");

    const { error } = await supabase.auth.verifyOtp({
        email,
        token: code,
        type: "email"
    });

    if (error) {
        const msg = error.message.toLowerCase();
        if (msg.includes("expired")) {
            setStatus("error", "Code expired");
            toast("Code expired. Click Resend to get a new one.");
        } else if (msg.includes("invalid") || msg.includes("not found")) {
            setStatus("error", "Invalid code");
            toast("Invalid code. Please try again.");
        } else {
            setStatus("error", "Verification failed");
            toast(error.message);
        }
        clearCode();
        loading(btn, false);
        return;
    }

    setVerified();
    loading(btn, false);
    setTimeout(() => routeUser("/verify/verify-email.html"), 1500);
}

$("verifyBtn").onclick = verifyCode;

// ─── Poll for link-based verification (fallback) ────────────────────
function startPolling() {
    let attempts = 0;
    const timer = setInterval(async () => {
        attempts++;
        const { data: { user } } = await supabase.auth.getUser();
        if (user?.email_confirmed_at) {
            clearInterval(timer);
            setVerified();
            setTimeout(() => routeUser("/verify/verify-email.html"), 1500);
        }
        if (attempts >= 40) clearInterval(timer);
    }, 3000);
}

// ─── Send verification code ─────────────────────────────────────────
async function sendCode() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return false;

    try {
        const { error } = await supabase.auth.signInWithOtp({ email: user.email });
        if (error) {
            toast("Could not send code: " + error.message);
            return false;
        }
        toast("Verification code sent to " + user.email, "success");
        startCooldown();
        return true;
    } catch (err) {
        toast("Could not send code: " + err.message);
        return false;
    }
}

// ─── Init ────────────────────────────────────────────────────────────
const { data: { user }, error: userErr } = await supabase.auth.getUser();
if (userErr || !user) {
    window.location.href = "/login/login.html";
} else {
    $("userEmail").textContent = user.email;
    $("openEmailBtn").href = detectEmailProvider(user.email);

    if (user.email_confirmed_at) {
        setVerified();
        setTimeout(() => routeUser("/verify/verify-email.html"), 1500);
    } else {
        // Auto-send a verification code on page load
        codeInputs[0].focus();
        startPolling();
        await sendCode();
    }
}

// ─── Resend code ─────────────────────────────────────────────────────
$("resendBtn").onclick = async () => {
    clearCode();
    setStatus("loading", "Sending new code\u2026");
    const sent = await sendCode();
    if (sent) {
        setStatus("waiting", "Waiting for code");
    } else {
        setStatus("error", "Failed to send");
    }
};

// ─── Logout / use different account ──────────────────────────────────
$("logoutBtn").onclick = async () => {
    await supabase.auth.signOut();
    window.location.href = "/login/login.html";
};

// ─── Fallback: resend link-based verification ────────────────────────
$("linkFallback").onclick = async e => {
    e.preventDefault();
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;
    const { error } = await supabase.auth.resend({ type: "signup", email: user.email });
    if (error) toast(error.message);
    else toast("Verification link sent! Check your inbox.", "success");
};
</script>
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
        .catch(err => console.error('Service worker registration failed:', err));
}
</script>
</body>
</html>
