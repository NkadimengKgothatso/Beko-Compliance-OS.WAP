<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1B2A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/bg.jpeg">
<title>Beko ComplianceOS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0F1A3A 0%,#1B2A5C 40%,#1B4A5C 100%);font-family:'Segoe UI',system-ui,sans-serif;color:#fff;overflow:hidden}
.splash{text-align:center;animation:fadeIn .8s ease}
.splash img{width:320px;max-width:80vw;filter:brightness(1.15);margin-bottom:20px;background:rgba(255,255,255,.12);padding:18px 24px;border-radius:18px;backdrop-filter:blur(4px)}
.splash p{font-size:1rem;opacity:.7;margin-bottom:40px;letter-spacing:.04em}
.bar{width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:3px;margin:0 auto;overflow:hidden}
.bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2CB5B8,#4CAF50);border-radius:3px;animation:load 2s ease forwards}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes load{to{width:100%}}
</style>
</head>
<body>
<div class="splash">
    <img src="/bg.jpeg" alt="Beko ComplianceOS">
    <p>Compliance guidance made simple</p>
    <div class="bar"><span></span></div>
</div>
<script>
// Register PWA service worker
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/service-worker.js")
        .catch(err => console.error("Service worker registration failed:", err));
}
setTimeout(()=>window.location.href="/login/login.html",2500);
</script>
</body>
</html>
