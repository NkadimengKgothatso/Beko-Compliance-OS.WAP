<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beko Compliance OS - Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b4cca">
</head>
<body>

<div class="container" id="container">

    <!-- SIGN UP FORM -->
    <div class="form-container sign-up-container">
        <form id="signupForm">
            <h1>Sign up </h1>
            
            <div class="social-login">
                <button type="button" id="googleSignup"><i class="fab fa-google"></i> Google</button>

            </div>
            
           
        </form>
    </div>

    <!-- SIGN IN FORM -->
    <div class="form-container sign-in-container">
        <form id="loginForm">
            <h1>Sign in</h1>
            
            <div class="social-login">
                <button type="button" id="googleLogin"><i class="fab fa-google"></i> Google</button>
            </div>
            
            
        </form>
    </div>

    <!-- OVERLAY -->
    <div class="overlay-container">
        <div class="overlay">
            <div class="overlay-panel overlay-left">
                <h1>Welcome !</h1>
                <p>Enter your details to login</p>
                <button class="ghost" id="loginSwitch">Sign In</button>
            </div>
            <div class="overlay-panel overlay-right">
                <h1>Hello</h1><br>
                <p>create an account to get started</p>
                <button class="ghost" id="registerSwitch">Sign Up</button>
            </div>
        </div>
    </div>

</div>

<script src="login.js"></script>
</body>
</html>
